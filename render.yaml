services:
  # Spring Boot Backend Web Service
  - type: web
    name: mealmesh-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: mealmesh-db
          property: connectionString
      - key: SPRING_REDIS_HOST
        fromService:
          type: keyvalue
          name: mealmesh-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: keyvalue
          name: mealmesh-redis
          property: port
      - key: APP_JWT_SECRET
        generateValue: true
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_FLYWAY_ENABLED
        value: "true"

  # Managed Key-Value / Redis Cache
  - type: keyvalue
    name: mealmesh-redis
    plan: free
    ipAllowList: []

# Managed PostgreSQL Database
databases:
  - name: mealmesh-db
    plan: free
    databaseName: mealmesh
    user: mealmesh
